<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1730">
<title>Ember Knight — a jumping game</title>
<style>
  :root{
    --ink:#1b1730; --ink2:#241d3d; --cream:#fff6d8;
    --ember:#ff8b45; --ember2:#ffd76a; --teal:#2fae95;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:
      radial-gradient(1200px 700px at 50% -10%, #35285c 0%, #1b1730 55%, #120f22 100%);
      color:var(--cream); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 3px #3a2f5e, 0 0 0 6px #241d3d;
         border-radius:6px; overflow:hidden; background:#1b1730}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%}
  #hud{position:absolute;inset:0;pointer-events:none;font-size:small}

  /* ---------- loading ---------- */
  #boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:14px;background:#1b1730;z-index:20;transition:opacity .35s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot h1{margin:0;font-size:clamp(18px,4vw,30px);letter-spacing:.14em;color:var(--ember2);
           text-shadow:0 3px 0 #7c2d12, 0 0 24px rgba(255,139,69,.5)}
  .bar{width:min(60vw,320px);height:10px;border:2px solid #4b3d78;border-radius:6px;overflow:hidden;background:#241d3d}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--ember2));transition:width .15s}
  #boot small{opacity:.75}

  /* ---------- touch controls ---------- */
  #touch{position:absolute;inset:0;z-index:12;display:none;pointer-events:none}
  body.touch #touch{display:block}
  .pad{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:14px;pointer-events:auto}
  .pad.left{left:16px}
  .pad.right{right:16px}
  .btn{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,246,216,.35);
       background:rgba(36,29,61,.55);color:var(--cream);font:700 22px/1 "Trebuchet MS",sans-serif;
       display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
       touch-action:none;user-select:none}
  .btn:active,.btn.on{background:rgba(255,139,69,.5);transform:scale(.95)}
  .btn.big{width:76px;height:76px;font-size:15px;letter-spacing:.06em}
  .hint{position:absolute;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 84px);
        text-align:center;font-size:12px;opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>

    <div id="touch">
      <div class="pad left">
        <div class="btn" data-key="left">◀</div>
        <div class="btn" data-key="right">▶</div>
      </div>
      <div class="pad right">
        <div class="btn" data-key="attack">⚔</div>
        <div class="btn big" data-key="jump">JUMP</div>
      </div>
    </div>

    <div id="boot">
      <h1>EMBER KNIGHT</h1>
      <div class="bar"><i id="bootbar"></i></div>
      <small id="bootmsg">sharpening the sword…</small>
    </div>
  </div>
</div>

<script type="module" src="./src/game.js"></script>
<noscript><p style="color:#fff">This game needs JavaScript enabled.</p></noscript>
</body>
</html>
