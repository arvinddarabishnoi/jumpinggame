<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>Gravity Run — 2D Physics Adventure</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="game"></canvas><div id="ui">
<section id="menu" class="screen active"><div class="menu-card"><div class="eyebrow">2D GRAVITY ADVENTURE</div><h1>GRAVITY<br><span>RUN</span></h1><p>Drive farther. Flip gravity. Land clean.</p><div class="menu-grid"><button data-action="play">PLAY</button><button data-action="garage">GARAGE</button><button data-action="missions">MISSIONS</button><button data-action="settings">SETTINGS</button></div><div class="record">BEST <b id="menu-best">0 m</b></div></div></section>
<section id="game-over" class="screen"><div class="menu-card"><div class="eyebrow">RUN ENDED</div><h2>CRASHED</h2><div class="results"><span>Distance <b id="result-distance">0 m</b></span><span>Coins <b id="result-coins">0</b></span><span>Score <b id="result-score">0</b></span><span>Best <b id="result-best">0 m</b></span></div><div class="menu-grid"><button data-action="restart">RESTART</button><button data-action="menu">MENU</button></div></div></section>
<section id="garage" class="screen"><div class="panel"><div class="panel-head"><button class="back" data-action="menu">←</button><h2>GARAGE</h2><span class="currency">◈ <b id="garage-coins">0</b></span></div><div class="garage-layout"><div class="car-show"><canvas id="garage-car" width="480" height="300"></canvas><div class="selected-car">TRAILBLAZER MK-I</div></div><div id="upgrades" class="upgrade-list"></div></div></div></section>
<section id="missions" class="screen"><div class="panel narrow"><div class="panel-head"><button class="back" data-action="menu">←</button><h2>MISSIONS</h2></div><div id="mission-list" class="mission-list"></div></div></section>
<section id="settings" class="screen"><div class="panel narrow"><div class="panel-head"><button class="back" data-action="menu">←</button><h2>SETTINGS</h2></div><div class="settings-list"><button id="reduced-motion">REDUCED MOTION <b>OFF</b></button><button id="sound-toggle">SOUND <b>ON</b></button><button id="reset-save">RESET SAVE</button></div></div></section></div>
<div id="hud" class="hidden"><div class="hud-top"><div class="stat"><span>DIST</span><b id="distance">0 m</b></div><div class="stat"><span>COINS</span><b id="coins">0</b></div><div class="stat"><span>BEST</span><b id="best">0 m</b></div><button class="hud-btn" id="pause-btn">Ⅱ</button></div><div class="hud-bars"><div class="bar"><span>FUEL</span><i><b id="fuel-bar"></b></i></div><div class="bar"><span>NITRO</span><i><b id="nitro-bar"></b></i></div><div class="bar"><span>GRAVITY</span><i><b id="gravity-bar"></b></i></div></div><div id="combo" class="combo"></div><div id="mission-hud" class="mission-hud"></div></div>
<div id="pause" class="screen"><div class="menu-card small"><div class="eyebrow">PAUSED</div><h2>TAKE A BREATH</h2><div class="menu-grid"><button data-action="resume">RESUME</button><button data-action="restart">RESTART</button><button data-action="menu">MENU</button></div></div></div>
<div id="touch" class="hidden"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="up">↗</button><button data-key="down">↘</button><button data-key="nitro">NITRO</button><button data-key="gravity">GRAV</button><button data-key="rewind">↶</button></div><div id="toast"></div><script src="game.js"></script></body></html>
